<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], tight: ['"Inter Tight"','sans-serif'] } } } }</script>
  
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; overflow: hidden; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    /* ══════════════════════════════
       MAIN CONTENT
    ══════════════════════════════ */
    .main-scroll { flex: 1; overflow-y: auto; background: #0d1117; }
    .content { padding: 24px; max-width: 1400px; }

    /* ── Stat cards ── */
    .stat-card {
      background: #161b22; border: 1px solid #21262d;
      border-radius: 12px; padding: 18px 18px 14px;
      position: relative; overflow: hidden; transition: border-color .2s;
    }
    .stat-card:hover { border-color: #30363d; }
    .stat-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 12px 12px 0 0;
    }
    .sc-green::after  { background: linear-gradient(90deg,#238636,#3fb950); }
    .sc-red::after    { background: linear-gradient(90deg,#da3633,#f85149); }
    .sc-blue::after   { background: linear-gradient(90deg,#1f6feb,#388bfd); }
    .sc-amber::after  { background: linear-gradient(90deg,#9e6a03,#d29922); }
    .sc-purple::after { background: linear-gradient(90deg,#8957e5,#a371f7); }
    .sc-teal::after   { background: linear-gradient(90deg,#0d7377,#14a085); }

    .stat-icon {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .trend-up   { color: #3fb950; background: rgba(35,134,54,.12); }
    .trend-down { color: #f85149; background: rgba(218,54,51,.12); }
    .badge-pill {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
    }

    /* ── Widget ── */
    .widget {
      background: #161b22; border: 1px solid #21262d; border-radius: 12px; overflow: hidden;
    }
    .widget-hd {
      padding: 14px 18px 12px; border-bottom: 1px solid #21262d;
      display: flex; align-items: center; justify-content: space-between;
    }
    .widget-title { font-size: 13.5px; font-weight: 600; color: #e6edf3; }
    .widget-sub   { font-size: 11.5px; color: #7d8590; margin-top: 1px; }

    /* ── Table ── */
    .fi-tbl { width: 100%; border-collapse: collapse; }
    .fi-tbl thead th {
      font-size: 11px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: #7d8590;
      padding: 9px 14px; background: #0d1117;
      border-bottom: 1px solid #21262d; white-space: nowrap;
    }
    .fi-tbl tbody td {
      font-size: 13px; color: #c9d1d9;
      padding: 11px 14px; border-bottom: 1px solid rgba(33,38,45,.8);
    }
    .fi-tbl tbody tr:hover td { background: rgba(255,255,255,.02); }
    .fi-tbl tbody tr:last-child td { border-bottom: none; }

    /* ── Progress ── */
    .prog-bg { height: 5px; background: #21262d; border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

    /* ── Tab pills ── */
    .tab-pill {
      padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .13s; color: #7d8590;
    }
    .tab-pill.active { background: rgba(35,134,54,.15); color: #3fb950; }
    .tab-pill:hover:not(.active) { background: #21262d; color: #c9d1d9; }


    /* ── Chart grid lines ── */
    .chart-line { stroke: #21262d; stroke-width: 1; }

    /* ── Action button ── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      background: #238636; color: #fff; border: none;
      border-radius: 8px; padding: 8px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background .13s;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px; padding: 7px 14px;
      font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
      transition: all .13s;
    }
    .btn-secondary:hover { background: #21262d; border-color: #484f58; }

    /* ── Input ── */
    .fi-input {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; color: #e6edf3; font-family: inherit;
      transition: border-color .13s; width: 100%;
    }
    .fi-input:focus { outline: none; border-color: #238636; box-shadow: 0 0 0 3px rgba(35,134,54,.15); }
    .fi-input::placeholder { color: #484f58; }
    .fi-select {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; color: #e6edf3; font-family: inherit;
      cursor: pointer;
    }
    .fi-select:focus { outline: none; border-color: #238636; }

    label.fi-label { font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 5px; display: block; }

    /* ── Card (form area) ── */
    .form-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 20px; }

    /* ── Stagger in ── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .stagger > * { animation: fadeUp .3s ease both; }
    .stagger > *:nth-child(1){animation-delay:.03s}
    .stagger > *:nth-child(2){animation-delay:.06s}
    .stagger > *:nth-child(3){animation-delay:.09s}
    .stagger > *:nth-child(4){animation-delay:.12s}
    .stagger > *:nth-child(5){animation-delay:.15s}
    .stagger > *:nth-child(6){animation-delay:.18s}

    /* ── Responsive ── */
    @media(max-width:768px){
      #sidebar{position:fixed;z-index:100;transform:translateX(-100%)}
      #sidebar.mobile-open{transform:translateX(0)}
    }

    /* ── Empty state ── */
    .empty-state { padding: 48px 24px; text-align: center; }
    .empty-icon { width: 56px; height: 56px; border-radius: 14px; background: #21262d; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }

    /* ── Notification dot ── */
    .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #f85149; border: 2px solid #161b22; }

    /* ── Dropdown ── */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; right: 0; top: calc(100%+6px); z-index: 200;
      background: #1c2128; border: 1px solid #30363d; border-radius: 10px;
      min-width: 180px; padding: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5); display: none;
    }
    .dropdown-menu.show { display: block; animation: fadeUp .15s ease; }
    .dd-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 7px; font-size: 12.5px;
      color: #c9d1d9; cursor: pointer; transition: all .1s;
    }
    .dd-item:hover { background: #21262d; }
    .dd-sep { height: 1px; background: #21262d; margin: 3px 0; }
  </style>
</head>
<body>
    <div class="page-section" id="page-jurnal">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
        <div><h1 style="font-family:'Inter Tight',sans-serif;font-size:20px;font-weight:700;color:#f0f6fc">ini halaman Jurnal Umum untuk baitsku yang ganteng</h1><p style="font-size:12.5px;color:#7d8590;margin-top:3px">April 2025 · 87 entri</p></div>
        <div style="display:flex;gap:8px">
          <input type="text" class="fi-input" placeholder="Cari transaksi..." style="width:200px;padding:7px 12px;font-size:12.5px">
          <button class="btn-primary" style="font-size:12px" onclick="showPage('input',null)">+ Tambah</button>
        </div>
      </div>
      <div class="widget">
        <div style="overflow-x:auto">
          <table class="fi-tbl">
            <thead><tr>
              <th style="text-align:left">Tanggal</th>
              <th style="text-align:left">No. Ref</th>
              <th style="text-align:left">Deskripsi</th>
              <th style="text-align:left">Akun</th>
              <th style="text-align:right">Debet</th>
              <th style="text-align:right">Kredit</th>
            </tr></thead>
            <tbody id="jurnalTable"></tbody>
          </table>
        </div>
        <div style="padding:10px 16px;border-top:1px solid #21262d;display:flex;justify-content:space-between;font-size:12px;color:#7d8590">
          <span>Menampilkan 1–10 dari 87 entri</span>
          <div style="display:flex;gap:4px">
            <button style="width:28px;height:28px;background:#21262d;border:none;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px">‹</button>
            <button style="width:28px;height:28px;background:#238636;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px;font-weight:700">1</button>
            <button style="width:28px;height:28px;background:#21262d;border:none;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px">2</button>
            <button style="width:28px;height:28px;background:#21262d;border:none;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px">›</button>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
