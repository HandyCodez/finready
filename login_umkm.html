<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>

  <body class="h-full bg-gray-100 dark:bg-gray-900 transition-colors">
    <!-- Toggle Dark Mode -->
    <div class="absolute top-5 right-5">
      <button
        onclick="toggleDark()"
        class="px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-700 dark:text-white"
      >
      🌙 Mode
      </button>
    </div>

    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
      <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center">
        <div class="flex justify-center mb-4">
          <div
            class="bg-green-500 text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold"
          >
            U
          </div>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
          Register UMKM
        </h2>
        <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
          Sudah punya akun?
          <a
            href="login-umkm.html"
            class="font-semibold text-green-600 hover:text-green-500"
          >
            Login disini
          </a>
        </p>

      </div>

      <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <form class="space-y-5">
          <!-- Username -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >
              Username
            </label>
            <input
              type="text"
              required
              class="mt-2 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Email -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >
              Email
            </label>
            <input
              type="email"
              required
              class="mt-2 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >
              Password
            </label>
            <input
              type="password"
              required
              class="mt-2 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >
              Confirm Password
            </label>
            <input
              type="password"
              required
              class="mt-2 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Button -->
          <button
            type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition"
          >
            Register UMKM
          </button>
        </form>

      </div>
    </div>

    <script>
      function toggleDark() {
        document.documentElement.classList.toggle("dark");
      }
    </script>
  </body>
</html>
