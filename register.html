<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar — FinReady</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility"
    />
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <style>
      .role-tab {
        transition: all 0.18s;
      }
      .role-tab.active {
        background: #16a34a;
        color: #fff;
        box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
      }
      .role-tab:not(.active) {
        color: #6b7280;
        background: transparent;
      }
      .role-tab:not(.active):hover {
        background: #f3f4f6;
        color: #111827;
      }

      /* Password strength bar */
      .pw-bar {
        height: 4px;
        border-radius: 999px;
        transition:
          width 0.3s,
          background 0.3s;
      }

      /* Extra field fade */
      .extra-field {
        transition:
          opacity 0.2s,
          max-height 0.3s;
        overflow: hidden;
      }
    </style>
  </head>

  <body class="h-full bg-gray-100 dark:bg-gray-900 transition-colors">
    <!-- Back button -->
    <div class="absolute top-5 left-5 z-10">
      <a
        href="index.html"
        class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-green-400 hover:text-green-600 transition"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
        Kembali
      </a>
    </div>

    <!-- Dark mode toggle -->
    <div class="absolute top-5 right-5 z-10">
      <button
        onclick="toggleDark()"
        class="px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-700 dark:text-white hover:opacity-80 transition"
      >
        🌙 Mode
      </button>
    </div>

    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
      <!-- Logo + Title -->
      <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center">
        <div class="flex justify-center mb-4">
          <a
            href="index.html"
            class="bg-green-500 hover:bg-green-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold transition"
          >
            F
          </a>
        </div>
        <h2
          id="regTitle"
          class="text-2xl font-bold text-gray-900 dark:text-white"
        >
          Daftar sebagai UMKM
        </h2>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
          Sudah punya akun?
          <a
            id="loginLink"
            href="login.html?role=umkm"
            class="font-semibold text-green-600 hover:text-green-500"
          >
            Login disini
          </a>
        </p>
      </div>

      <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-sm">
        <!-- ROLE TOGGLE -->
        <div
          class="flex gap-1.5 p-1.5 bg-gray-200 dark:bg-gray-700 rounded-xl mb-8"
        >
          <button
            id="tabUMKM"
            onclick="switchRole('umkm')"
            class="role-tab active flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-semibold"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg> UMKM
          </button>
          <button
            id="tabInvestor"
            onclick="switchRole('investor')"
            class="role-tab flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-semibold"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg> Investor
          </button>
        </div>

        <!-- Role info banner -->
        <div
          id="roleBanner"
          class="mb-6 flex items-start gap-3 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-xl px-4 py-3"
        >
          <span class="text-xl mt-0.5" id="bannerIcon">🏪</span>
          <div>
            <div
              class="text-sm font-semibold text-green-800 dark:text-green-300"
              id="bannerTitle"
            >
              Akun UMKM
            </div>
            <div
              class="text-xs text-green-700 dark:text-green-400 mt-0.5"
              id="bannerDesc"
            >
              Kelola laporan keuangan, pantau arus kas, dan ajukan pendanaan ke
              investor.
            </div>
          </div>
        </div>

        <!-- FORM -->
        <form class="space-y-4" onsubmit="handleRegister(event)">
          <!-- Username -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
            >
              Username <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              required
              placeholder="nama_pengguna"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            />
          </div>
          <!-- Email -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
            >
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              required
              placeholder="nama@email.com"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
            >
              Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                id="pwInput"
                type="password"
                required
                placeholder="Min. 8 karakter"
                oninput="checkPw(this.value)"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2.5 pr-10 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 transition"
              />
              <button
                type="button"
                onclick="togglePw('pwInput', 'eyeOpen1', 'eyeClosed1')"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
              >
                <svg
                  id="eyeOpen1"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eyeClosed1"
                  class="hidden"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                  />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <!-- Strength bar -->
            <div class="mt-2 flex gap-1" id="pwBars">
              <div
                class="pw-bar flex-1 bg-gray-200 dark:bg-gray-600"
                id="bar1"
              ></div>
              <div
                class="pw-bar flex-1 bg-gray-200 dark:bg-gray-600"
                id="bar2"
              ></div>
              <div
                class="pw-bar flex-1 bg-gray-200 dark:bg-gray-600"
                id="bar3"
              ></div>
              <div
                class="pw-bar flex-1 bg-gray-200 dark:bg-gray-600"
                id="bar4"
              ></div>
            </div>
            <p id="pwStrengthLabel" class="text-xs text-gray-400 mt-1"></p>
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
            >
              Konfirmasi Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                id="pwConfirm"
                type="password"
                required
                placeholder="Ulangi password"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2.5 pr-10 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 transition"
              />
              <button
                type="button"
                onclick="togglePw('pwConfirm', 'eyeOpen2', 'eyeClosed2')"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
              >
                <svg
                  id="eyeOpen2"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eyeClosed2"
                  class="hidden"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                  />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <p id="pwMatchMsg" class="text-xs mt-1 hidden"></p>
          </div>

          <!-- Terms -->
          <div class="flex items-start gap-2 pt-1">
            <input
              id="terms"
              type="checkbox"
              required
              class="mt-0.5 w-4 h-4 rounded border-gray-300 text-green-600 focus:ring-green-500 cursor-pointer accent-green-600"
            />
            <label
              for="terms"
              class="text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none leading-snug"
            >
              Saya menyetujui
              <a
                href="#"
                class="text-green-600 hover:text-green-500 font-medium"
                >Syarat & Ketentuan</a
              >
              dan
              <a
                href="#"
                class="text-green-600 hover:text-green-500 font-medium"
                >Kebijakan Privasi</a
              >
            </label>
          </div>

          <!-- Error -->
          <div
            id="errorMsg"
            class="hidden items-center gap-2 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 text-red-600 dark:text-red-400 text-sm rounded-lg px-4 py-3"
          >
            ⚠️
            <span id="errorText"
              >Pastikan semua kolom terisi dengan benar.</span
            >
          </div>

          <!-- Submit -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-green-600 hover:bg-green-700 active:scale-[.98] text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2"
          >
            <span id="btnText">Daftar sebagai UMKM</span>
            <svg
              id="btnSpinner"
              class="hidden animate-spin w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="white"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="white"
                d="M4 12a8 8 0 018-8v8H4z"
              />
            </svg>
          </button>
        </form>
      </div>
    </div>

    <script>
      let currentRole = "umkm";

      const roleData = {
        umkm: {
          title: "Daftar sebagai UMKM",
          btn: "Daftar sebagai UMKM",
          loginHref: "login.html?role=umkm",
          bannerIcon: "🏪",
          bannerTitle: "Akun UMKM",
          bannerDesc:
            "Kelola laporan keuangan, pantau arus kas, dan ajukan pendanaan ke investor.",
          extraLabel: "Nama Usaha",
          extraPlaceholder: "Toko Budi Makmur",
          extraRequired: true,
        },
        investor: {
          title: "Daftar sebagai Investor",
          btn: "Daftar sebagai Investor",
          loginHref: "login.html?role=investor",
          bannerIcon: "📈",
          bannerTitle: "Akun Investor",
          bannerDesc:
            "Analisis laporan keuangan UMKM, temukan peluang investasi yang tepat.",
          extraLabel: "Jenis Investasi",
          extraPlaceholder: "Saham, Obligasi, Modal Ventura...",
          extraRequired: false,
        },
      };

      // Auto-select role from URL param
      const params = new URLSearchParams(location.search);
      if (params.get("role") === "investor") switchRole("investor");

      function switchRole(role) {
        currentRole = role;
        const d = roleData[role];
        const isUMKM = role === "umkm";

        document.getElementById("tabUMKM").classList.toggle("active", isUMKM);
        document
          .getElementById("tabInvestor")
          .classList.toggle("active", !isUMKM);

        document.getElementById("regTitle").textContent = d.title;
        document.getElementById("loginLink").href = d.loginHref;
        document.getElementById("btnText").textContent = d.btn;

        document.getElementById("bannerIcon").textContent = d.bannerIcon;
        document.getElementById("bannerTitle").textContent = d.bannerTitle;
        document.getElementById("bannerDesc").textContent = d.bannerDesc;

        document.getElementById("extraLabel").innerHTML =
          d.extraLabel +
          (d.extraRequired ? ' <span class="text-red-500">*</span>' : "");
        document.getElementById("extraInput").placeholder = d.extraPlaceholder;
        document.getElementById("extraInput").required = d.extraRequired;
      }

      function togglePw(inputId, openId, closedId) {
        const inp = document.getElementById(inputId);
        const openIcon = document.getElementById(openId);
        const closedIcon = document.getElementById(closedId);

        const isHidden = inp.type === "password";
        inp.type = isHidden ? "text" : "password";

        openIcon.classList.toggle("hidden", isHidden);
        closedIcon.classList.toggle("hidden", !isHidden);
      }

      function checkPw(val) {
        const bars = ["bar1", "bar2", "bar3", "bar4"];
        const colors = {
          1: "#ef4444",
          2: "#f59e0b",
          3: "#84cc16",
          4: "#16a34a",
        };
        const labels = {
          1: "Sangat lemah",
          2: "Lemah",
          3: "Cukup kuat",
          4: "Kuat 💪",
        };

        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        bars.forEach((id, i) => {
          document.getElementById(id).style.background =
            i < score ? colors[score] : "";
          document.getElementById(id).style.background =
            i < score ? colors[score] : "#e5e7eb";
        });

        const lbl = document.getElementById("pwStrengthLabel");
        lbl.textContent = val ? labels[score] || "" : "";
        lbl.style.color = val ? colors[score] : "";
      }

      // Live confirm match check
      document
        .getElementById("pwConfirm")
        .addEventListener("input", function () {
          const pw = document.getElementById("pwInput").value;
          const msg = document.getElementById("pwMatchMsg");
          if (!this.value) {
            msg.classList.add("hidden");
            return;
          }
          msg.classList.remove("hidden");
          if (this.value === pw) {
            msg.textContent = "✅ Password cocok";
            msg.className = "text-xs mt-1 text-green-600";
          } else {
            msg.textContent = "❌ Password tidak cocok";
            msg.className = "text-xs mt-1 text-red-500";
          }
        });

      function handleRegister(e) {
        e.preventDefault();
        const pw = document.getElementById("pwInput").value;
        const conf = document.getElementById("pwConfirm").value;
        const errMsg = document.getElementById("errorMsg");
        const errText = document.getElementById("errorText");

        if (pw !== conf) {
          errText.textContent = "Password dan konfirmasi password tidak sama.";
          errMsg.classList.remove("hidden");
          errMsg.classList.add("flex");
          return;
        }
        errMsg.classList.add("hidden");

        const btn = document.getElementById("submitBtn");
        const spinner = document.getElementById("btnSpinner");
        const txt = document.getElementById("btnText");
        btn.disabled = true;
        spinner.classList.remove("hidden");
        txt.textContent = "Mendaftarkan...";

        setTimeout(() => {
          spinner.classList.add("hidden");
          btn.disabled = false;
          txt.textContent = roleData[currentRole].btn;
          window.location.href = "dashboard.html";
        }, 1800);
      }

      function toggleDark() {
        document.documentElement.classList.toggle("dark");
      }
    </script>
  </body>
</html>
